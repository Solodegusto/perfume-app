<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parfüm Tasarımcısı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lang-switch">
    <button type="button" data-lang="tr">TR</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <h1 data-i18n="heading"></h1>
  <p data-i18n="intro"></p>
  <div id="personalities"></div>
  <p id="warning" role="alert"></p>
  <button id="create" data-i18n="create"></button>
  <h2 data-i18n="resultTitle"></h2>
  <div id="result"></div>

  <script>
    // ---- Arayüz metinleri / UI texts ----
    const UI = {
      tr: {
        title: "Parfüm Tasarımcısı",
        heading: "Parfümünü Tasarla",
        intro: "Kendi kişilik özelliklerini seç:",
        create: "Parfümümü Oluştur",
        resultTitle: "Sonuç",
        warning: "Lütfen en az bir kişilik seç.",
        similarityLabel: "Benzerlik",
        similarity: (pct, fam) => `Parfüm tasarımın %${pct} oranında ${fam} kokulara yakın.`,
        uniquenessLabel: "Eşsizlik",
        uniqueness: (pct) => `Bu kombinasyon kullanıcıların yalnızca %${pct}’i tarafından seçilmiş; oldukça farklı bir tercih.`,
        profileLabel: "Kişilik profili",
        profile: (list) => `Parfümün karakteri ${list.toLocaleLowerCase('tr')}.`,
        notesLabel: "Önerilen notalar"
      },
      en: {
        title: "Perfume Designer",
        heading: "Design Your Perfume",
        intro: "Choose your personality traits:",
        create: "Create My Perfume",
        resultTitle: "Result",
        warning: "Please choose at least one personality trait.",
        similarityLabel: "Similarity",
        similarity: (pct, fam) => `Your perfume design is ${pct}% close to ${fam.toLowerCase()} scents.`,
        uniquenessLabel: "Uniqueness",
        uniqueness: (pct) => `Only ${pct}% of users chose this combination — a truly distinctive choice.`,
        profileLabel: "Personality profile",
        profile: (list) => `Your perfume's character is ${list.toLowerCase()}.`,
        notesLabel: "Suggested notes"
      }
    };

    let notesData = [];
    let lastSelection = null; // son seçilen kişilik indeksleri / last selected trait indexes

    // Dil seçimi: ?lang=en > kayıtlı tercih > tarayıcı dili
    function initialLang() {
      const fromUrl = new URLSearchParams(location.search).get('lang');
      if (fromUrl && UI[fromUrl]) return fromUrl;
      try {
        const saved = localStorage.getItem('lang');
        if (saved && UI[saved]) return saved;
      } catch (e) {}
      return (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en';
    }
    let lang = initialLang();

    function uniquePersonalities() {
      const seen = new Set();
      return notesData.filter(n => {
        if (seen.has(n.personality.tr)) return false;
        seen.add(n.personality.tr);
        return true;
      });
    }

    function renderPersonalities() {
      const container = document.getElementById('personalities');
      const checked = new Set(
        Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value)
      );
      container.innerHTML = '';
      uniquePersonalities().forEach(n => {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = n.personality.tr; // sabit anahtar / stable key
        input.checked = checked.has(input.value);
        label.appendChild(input);
        label.append(' ' + n.personality[lang]);
        container.appendChild(label);
        container.appendChild(document.createElement('br'));
      });
    }

    function setLang(newLang) {
      lang = newLang;
      try { localStorage.setItem('lang', lang); } catch (e) {}
      document.documentElement.lang = lang;
      document.title = UI[lang].title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = UI[lang][el.dataset.i18n];
      });
      document.querySelectorAll('#lang-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
      document.getElementById('warning').textContent = '';
      renderPersonalities();
      if (lastSelection) renderResult(); // sonucu yeni dilde tekrar yaz
    }

    function renderResult() {
      const t = UI[lang];
      const { keys, similarityPct, uniquenessPct } = lastSelection;
      const selectedNotes = notesData.filter(n => keys.includes(n.personality.tr));

      // En çok görülen koku ailesi / most common family
      const familyCount = {};
      selectedNotes.forEach(n => {
        familyCount[n.family[lang]] = (familyCount[n.family[lang]] || 0) + 1;
      });
      const topFamily = Object.entries(familyCount).sort((a, b) => b[1] - a[1])[0][0];

      const traits = [...new Set(selectedNotes.map(n => n.personality[lang]))].join(', ');

      document.getElementById('result').innerHTML = `
        <p><b>${t.similarityLabel}:</b> ${t.similarity(similarityPct, topFamily)}</p>
        <p><b>${t.uniquenessLabel}:</b> ${t.uniqueness(uniquenessPct)}</p>
        <p><b>${t.profileLabel}:</b> ${t.profile(traits)}</p>
        <p><b>${t.notesLabel}:</b> ${selectedNotes.map(n => n.name[lang]).join(', ')}</p>
      `;

      // --- YENİ ALTERNATİF PARFÜM SİSTEMİ ENTEGRASYONU ---
      // Oluşturulan parfümün notalarını hem Türkçe hem İngilizce eşleşebilsin diye topluyoruz
      const olusanNotalar = selectedNotes.reduce((acc, n) => {
        acc.push(n.name.tr, n.name.en);
        return acc;
      }, []);

      fetch('alternatives.json')
        .then(res => res.json())
        .then(tumAlternatifler => {
          const benzerler = benzerParfumleriBul(olusanNotalar, tumAlternatifler);
          
          // Ekranda sonuçların basılacağı div elementini bul veya oluştur
          let altBox = document.getElementById('alternative-box');
          if (!altBox) {
            altBox = document.createElement('div');
            altBox.id = 'alternative-box';
            altBox.style.marginTop = '20px';
            altBox.style.padding = '15px';
            altBox.style.borderRadius = '8px';
            altBox.style.background = 'rgba(255, 255, 255, 0.05)';
            altBox.style.border = '1px solid rgba(255, 255, 255, 0.1)';
            
            // Sonuç kutusunun altına ekle
            document.getElementById('result').appendChild(altBox);
          }
          
          // Başlık ve kartları dile göre hazırla
          const baslik = lang === 'en' 
            ? '<h3 style="margin-top:0; color:#e0b0ff;">Closest Commercial Matches:</h3>' 
            : '<h3 style="margin-top:0; color:#e0b0ff;">Bu Nota Dizilimine En Yakın Alternatifler:</h3>';
            
          let kartlarHTML = baslik;
          
          if (benzerler.length === 0) {
            kartlarHTML += lang === 'en' 
              ? '<p>Your blend is completely unique! No close commercial alternatives found.</p>' 
              : '<p>Karışımınız tamamen benzersiz! Yakın bir ticari alternatif bulunamadı.</p>';
          } else {
            benzerler.forEach(p => {
              kartlarHTML += `
                <div style="margin-bottom: 10px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 4px; border-left: 3px solid #e0b0ff;">
                  <strong>${p.marka} - ${p.isim}</strong> (${p.tur})<br>
                  <small>${lang === 'en' ? 'Match' : 'Uyum'}: %${p.oran}</small>
                </div>
              `;
            });
          }
          
          altBox.innerHTML = kartlarHTML;
        })
        .catch(err => console.error("Alternatifler yüklenirken hata oluştu:", err));
    }

    document.querySelectorAll('#lang-switch button').forEach(b => {
      b.addEventListener('click', () => setLang(b.dataset.lang));
    });

    document.getElementById('create').addEventListener('click', () => {
      const checkboxes = document.querySelectorAll('#personalities input:checked');
      const warning = document.getElementById('warning');
      if (checkboxes.length === 0) {
        warning.textContent = UI[lang].warning;
        return;
      }
      warning.textContent = '';
      lastSelection = {
        keys: Array.from(checkboxes).map(cb => cb.value),
        similarityPct: 60 + Math.floor(Math.random() * 30),
        uniquenessPct: Math.floor(Math.random() * 30) + 10
      };
      renderResult();
    });

    fetch('notes.json')
      .then(res => res.json())
      .then(data => {
        notesData = data;
        setLang(lang);
      });

    setLang(lang); // metinleri hemen göster / show texts immediately

    // Benzer parfümleri hesaplayan fonksiyon
    function benzerParfumleriBul(secilenNotalar, tumAlternatifler) {
      const sonuclar = [];
      
      tumAlternatifler.forEach(parfum => {
        // Uygulamanın ürettiği notalar ile niş parfümün notalarını kıyasla
        const ortakNotalar = secilenNotalar.filter(nota => 
          parfum.notalar.map(n => n.toLowerCase()).includes(nota.toLowerCase())
        );
        
        if (ortakNotalar.length > 0) {
          const toplamBenzersiz = new Set([...secilenNotalar, ...parfum.notalar]);
          const oran = Math.round((ortakNotalar.length / toplamBenzersiz.size) * 100);
          
          if (oran > 10) { // Eşleşme hassasiyetini %10 ve üzeri yaptık
            sonuclar.push({
              marka: parfum.marka,
              isim: parfum.isim,
              tur: parfum.tur[lang] || parfum.tur['tr'],
              oran: oran
            });
          }
        }
      });
      return sonuclar.sort((a, b) => b.oran - a.oran);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parfüm Tasarımcısı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lang-switch">
    <button type="button" data-lang="tr">TR</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <h1 data-i18n="heading"></h1>
  <p data-i18n="intro"></p>
  <div id="personalities"></div>
  <p id="warning" role="alert"></p>
  
  <!-- Butonların yan yana durması için bir kapsayıcı -->
  <div style="margin-top: 20px; display: flex; gap: 10px;">
    <button id="create" data-i18n="create"></button>
    <button id="clear-btn" data-i18n="clear" style="background: #333; color: #fff; border: 1px solid #555; padding: 10px 15px; border-radius: 5px; cursor: pointer; display: none;"></button>
  </div>

  <h2 data-i18n="resultTitle"></h2>
  <div id="result"></div>
  
  <!-- Alternatif parfümlerin listeleneceği kutu -->
  <div id="alternative-box"></div>

  <script>
    // ---- Arayüz metinleri / UI texts ----
    const UI = {
      tr: {
        title: "Parfüm Tasarımcısı",
        heading: "Parfümünü Tasarla",
        intro: "Kendi kişilik özelliklerini seç:",
        create: "Parfümümü Oluştur",
        clear: "Seçimleri Temizle",
        resultTitle: "Sonuç",
        warning: "Lütfen en az bir kişilik seç.",
        similarityLabel: "Benzerlik",
        similarity: (pct, fam) => `Parfüm tasarımın %${pct} oranında ${fam} kokulara yakın.`,
        uniquenessLabel: "Eşsizlik",
        uniqueness: (pct) => `Bu kombinasyon kullanıcıların yalnızca %${pct}’i tarafından seçilmiş; oldukça farklı bir tercih.`,
        profileLabel: "Kişilik profili",
        profile: (list) => `Parfümün karakteri ${list.toLocaleLowerCase('tr')}.`,
        notesLabel: "Önerilen notalar",
        altTitle: (pct) => `Bu nota dizilimine (%${pct}) en yakın alternatifler şunlardır:`,
        altEmpty: "Tasarımınız tamamen benzersiz! Yakın bir ticari alternatif bulunamadı.",
        disclaimer: "Uygulamamızda listelenen nota benzerlikleri tamamen bilgilendirme amaçlı algoritmik eşleştirmelerdir. Bahsi geçen markalarla hiçbir resmi bağımız bulunmamaktadır."
      },
      en: {
        title: "Perfume Designer",
        heading: "Design Your Perfume",
        intro: "Choose your personality traits:",
        create: "Create My Perfume",
        clear: "Clear Selection",
        resultTitle: "Result",
        warning: "Please choose at least one personality trait.",
        similarityLabel: "Similarity",
        similarity: (pct, fam) => `Your perfume design is ${pct}% close to ${fam.toLowerCase()} scents.`,
        uniquenessLabel: "Uniqueness",
        uniqueness: (pct) => `Only ${pct}% of users chose this combination — a truly distinctive choice.`,
        profileLabel: "Personality profile",
        profile: (list) => `Your perfume's character is ${list.toLowerCase()}.`,
        notesLabel: "Suggested notes",
        altTitle: (pct) => `The closest alternatives to this note profile (%${pct}) are:`,
        altEmpty: "Your blend is completely unique! No close commercial alternatives found.",
        disclaimer: "The note similarities listed in our application are entirely algorithmic matches for informational purposes. We have no official connection with the mentioned brands."
      }
    };

    let notesData = [];
    let alternativesData = []; 
    let lastSelection = null; 

    function initialLang() {
      const fromUrl = new URLSearchParams(location.search).get('lang');
      if (fromUrl && UI[fromUrl]) return fromUrl;
      try {
        const saved = localStorage.getItem('lang');
        if (saved && UI[saved]) return saved;
      } catch (e) {}
      return (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en';
    }
    let lang = initialLang();

    function uniquePersonalities() {
      const seen = new Set();
      return notesData.filter(n => {
        if (seen.has(n.personality.tr)) return false;
        seen.add(n.personality.tr);
        return true;
      });
    }

    function renderPersonalities() {
      const container = document.getElementById('personalities');
      if (!container) return;
      const checked = new Set(
        Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value)
      );
      container.innerHTML = '';
      uniquePersonalities().forEach(n => {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = n.personality.tr; 
        input.checked = checked.has(input.value);
        label.appendChild(input);
        label.append(' ' + n.personality[lang]);
        container.appendChild(label);
        container.appendChild(document.createElement('br'));
      });
    }

    function setLang(newLang) {
      lang = newLang;
      try { localStorage.setItem('lang', lang); } catch (e) {}
      document.documentElement.lang = lang;
      document.title = UI[lang].title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = UI[lang][el.dataset.i18n];
      });
      document.querySelectorAll('#lang-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
      document.getElementById('warning').textContent = '';
      
      const clearBtn = document.getElementById('clear-btn');
      if(clearBtn) clearBtn.textContent = UI[lang].clear;
      
      renderPersonalities();
      if (lastSelection) renderResult(); 
    }

    // Notaları İngilizce terimlere çeviren mini sözlük
    const notaSozlugu = {
      "gül": "rose", "vanilya": "vanilla", "kakao": "cacao", "tütün": "tobacco",
      "baharat": "spices", "sandal ağacı": "sandalwood", "sedir": "cedar",
      "deri": "leather", "iris": "iris", "menekşe": "violet", "bal": "honey",
      "balmumu": "beeswax", "zencefil": "ginger", "limon": "lemon",
      "bergamot": "bergamot", "nane": "mint", "tarçın": "cinnamon"
    };

    function renderResult() {
      const t = UI[lang];
      const { keys, similarityPct, uniquenessPct } = lastSelection;
      const selectedNotes = notesData.filter(n => keys.includes(n.personality.tr));

      const familyCount = {};
      selectedNotes.forEach(n => {
        const f = n.family[lang];
        familyCount[f] = (familyCount[f] || 0) + 1;
      });
      const sortedFamilies = Object.entries(familyCount).sort((a, b) => b[1] - a[1]);
      const topFamily = sortedFamilies.length > 0 ? sortedFamilies[0][0] : "";

      const traits = [...new Set(selectedNotes.map(n => n.personality[lang]))].join(', ');

      document.getElementById('result').innerHTML = `
        <p><b>${t.similarityLabel}:</b> ${t.similarity(similarityPct, topFamily)}</p>
        <p><b>${t.uniquenessLabel}:</b> ${t.uniqueness(uniquenessPct)}</p>
        <p><b>${t.profileLabel}:</b> ${t.profile(traits)}</p>
        <p><b>${t.notesLabel}:</b> ${selectedNotes.map(n => n.name[lang]).join(', ')}</p>
      `;

      // --- ALTERNATİF PARFÜM HESAPLAMA ---
      const kullaniciNotalari = selectedNotes.map(n => {
        const trIsim = n.name.tr.toLowerCase();
        return notaSozlugu[trIsim] || trIsim;
      });

      const benzerler = [];
      if (Array.isArray(alternativesData)) {
        alternativesData.forEach(parfum => {
          const ortakNotalar = kullaniciNotalari.filter(nota => 
            parfum.notalar.map(n => n.toLowerCase()).includes(nota.toLowerCase())
          );
          
          if (ortakNotalar.length > 0) {
            const toplamBenzersiz = new Set([...kullaniciNotalari, ...parfum.notalar]);
            const oran = Math.round((ortakNotalar.length / toplamBenzersiz.size) * 100);
            
            // %25 barajı: Sadece %25 ve üzeri ciddi benzerlikleri listele, %11'leri gizle
            if (oran >= 25) { 
              benzerler.push({
                marka: parfum.marka,
                isim: parfum.isim,
                tur: parfum.tur[lang],
                oran: oran
              });
            }
          }
        });
      }

      benzerler.sort((a, b) => b.oran - a.oran);

      const altBox = document.getElementById('alternative-box');
      if (altBox) {
        // En yüksek benzerlik oranını başlığa dinamik gönderiyoruz. Eşleşme yoksa varsayılan 0 basmasın diye kontrol.
        const enYuksekOran = benzerler.length > 0 ? benzerler[0].oran : 0;
        let altHTML = "";

        if (benzerler.length === 0) {
          altHTML += `<h3 style="margin-top:25px; color:#9b5de5;">${t.altTitle(0)}</h3>`;
          altHTML += `<p style="font-style:italic; color:#777;">${t.altEmpty}</p>`;
        } else {
          altHTML += `<h3 style="margin-top:25px; color:#9b5de5;">${t.altTitle(enYuksekOran)}</h3>`;
          benzerler.forEach(p => {
            altHTML += `
              <div style="margin-bottom: 12px; padding: 12px; background: rgba(255,255,255,0.04); border-left: 4px solid #9b5de5; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <strong style="font-size:16px; display:block; color:#fff;">${p.marka} - ${p.isim}</strong>
                  <span style="font-size:12px; color:#aaa;">${p.tur}</span>
                </div>
                <span style="background:#9b5de5; color:#fff; padding:4px 8px; border-radius:4px; font-weight:bold; font-size:14px;">%${p.oran}</span>
              </div>
            `;
          });
        }
        
        // İstediğin yasal uyarı metni alanın altına ekleniyor
        altHTML += `
          <p style="margin-top:20px; font-size:11px; color:#666; line-height:1.4; border-top:1px solid rgba(255,255,255,0.05); padding-top:10px;">
            ⚠️ ${t.disclaimer}
          </p>
        `;
        altBox.innerHTML = altHTML;
      }
      
      // Temizleme butonunu görünür yap
document.getElementById('clear-btn').style.display = 'inline-block';
}
document.querySelectorAll('#lang-switch button').forEach(b => {
b.addEventListener('click', () => setLang(b.dataset.lang));
});
document.getElementById('create').addEventListener('click', () => {
const checkboxes = document.querySelectorAll('#personalities input:checked');
const warning = document.getElementById('warning');
if (checkboxes.length === 0) {
warning.textContent = UI[lang].warning;
return;
}
warning.textContent = '';
lastSelection = {
keys: Array.from(checkboxes).map(cb => cb.value),
similarityPct: 60 + Math.floor(Math.random() * 30),
uniquenessPct: Math.floor(Math.random() * 30) + 10
};
renderResult();
});
// --- TEMİZLEME BUTONU MANTIĞI ---
document.getElementById('clear-btn').addEventListener('click', () => {
// Tüm checkbox seçimlerini kaldır
document.querySelectorAll('#personalities input:checked').forEach(cb => cb.checked = false);
// Ekrandaki eski sonuçları temizle
document.getElementById('result').innerHTML = '';
document.getElementById('alternative-box').innerHTML = '';
document.getElementById('warning').textContent = '';
// Değişkenleri sıfırla ve butonu gizle
lastSelection = null;
document.getElementById('clear-btn').style.display = 'none';
});
// JSON Yükleme Zinciri
fetch('notes.json')
.then(res => res.json())
.then(data => {
notesData = data;
return fetch('alternatives.json');
})
.then(res => res.json())
.then(altData => {
alternativesData = altData;
setLang(lang);
})
.catch(err => {
console.error("Veri yüklenemedi:", err);
setLang(lang);
});
